<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#166534">
  <title>FarmOS Lite – Professional Farm Management</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 17 (more stable) -->
  <script src="https://cdn.jsdelivr.net/npm/react@17.0.2/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@17.0.2/umd/react-dom.development.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { transition: background-color 0.3s ease, border-color 0.3s ease, color 0.2s ease; }
    .sidebar-transition { transition: transform 0.3s ease-in-out; }
    @media (max-width: 768px) {
      .sidebar-hidden { transform: translateX(-100%); }
      .sidebar-visible { transform: translateX(0); }
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #166534; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #14532d; }
    .dark ::-webkit-scrollbar-track { background: #1f2937; }
    .dark ::-webkit-scrollbar-thumb { background: #059669; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors">
  <div id="root"></div>

  <script>
    // ============================================================
    // COMPLETE FARMOS LITE - WORKING SINGLE FILE
    // ============================================================
    
    const { useState, useEffect, createContext, useContext, useReducer, useCallback, useMemo } = React;
    const ReactDOM = window.ReactDOM;
    
    // ==================== UTILITIES ====================
    
    const formatDate = (date) => {
      const d = new Date(date);
      return d.toISOString().split('T')[0];
    };
    
    const today = () => formatDate(new Date());
    
    const getWeekDays = () => {
      const now = new Date();
      const dayOfWeek = now.getDay();
      const monday = new Date(now);
      monday.setDate(now.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        days.push(formatDate(d));
      }
      return days;
    };
    
    const isWithinLastNDays = (dateStr, days) => {
      const date = new Date(dateStr);
      const nDaysAgo = new Date();
      nDaysAgo.setDate(nDaysAgo.getDate() - days);
      return date >= nDaysAgo;
    };
    
    const STORAGE_KEYS = {
      FARM_DATA: 'farmos_farm_data',
      SETTINGS: 'farmos_settings',
    };
    
    const storage = {
      get: (key, defaultValue) => {
        try {
          const item = localStorage.getItem(key);
          return item ? JSON.parse(item) : defaultValue;
        } catch { return defaultValue; }
      },
      set: (key, value) => {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch { return false; }
      },
    };
    
    const FARM_PRESETS = {
      broilers: {
        name: 'Broilers',
        birdCount: 500,
        feedPerBirdGrams: 150,
        bagCost: 25,
        bagWeightKg: 25,
        sellingPrice: 8,
        cycleDays: 42,
        farmType: 'broilers',
      },
      layers: {
        name: 'Layers',
        birdCount: 200,
        feedPerBirdGrams: 120,
        bagCost: 25,
        bagWeightKg: 25,
        sellingPrice: 6,
        cycleDays: 365,
        farmType: 'layers',
      },
      quails: {
        name: 'Quails',
        birdCount: 1000,
        feedPerBirdGrams: 30,
        bagCost: 20,
        bagWeightKg: 25,
        sellingPrice: 2,
        cycleDays: 45,
        farmType: 'quails',
      },
      turkeys: {
        name: 'Turkeys',
        birdCount: 100,
        feedPerBirdGrams: 300,
        bagCost: 35,
        bagWeightKg: 25,
        sellingPrice: 25,
        cycleDays: 120,
        farmType: 'turkeys',
      },
    };
    
    // ==================== INITIAL STATES ====================
    
    const initialFarmState = {
      farmParams: {
        birdCount: 100,
        feedPerBirdGrams: 120,
        bagCost: 25,
        bagWeightKg: 25,
        sellingPrice: 5,
        cycleDays: 60,
        farmType: 'layers',
      },
      eggEntries: [],
      hatchEntries: [],
      mortalityEntries: [],
    };
    
    const initialSettings = {
      currency: '$',
      theme: 'light',
      farmType: 'layers',
    };
    
    // ==================== REDUCERS ====================
    
    const farmReducer = (state, action) => {
      switch (action.type) {
        case 'UPDATE_FARM_PARAMS':
          return { ...state, farmParams: { ...state.farmParams, ...action.payload } };
        case 'APPLY_PRESET':
          return { ...state, farmParams: { ...state.farmParams, ...action.payload } };
        case 'ADD_EGG_ENTRY':
          return { ...state, eggEntries: [...state.eggEntries, action.payload] };
        case 'DELETE_EGG_ENTRY':
          return { ...state, eggEntries: state.eggEntries.filter(e => e.id !== action.payload) };
        case 'ADD_HATCH_ENTRY':
          return { ...state, hatchEntries: [...state.hatchEntries, action.payload] };
        case 'DELETE_HATCH_ENTRY':
          return { ...state, hatchEntries: state.hatchEntries.filter(h => h.id !== action.payload) };
        case 'ADD_MORTALITY_ENTRY':
          return { ...state, mortalityEntries: [...state.mortalityEntries, action.payload] };
        case 'DELETE_MORTALITY_ENTRY':
          return { ...state, mortalityEntries: state.mortalityEntries.filter(m => m.id !== action.payload) };
        case 'IMPORT_DATA':
          return action.payload;
        case 'RESET_ALL':
          return initialFarmState;
        default:
          return state;
      }
    };
    
    const settingsReducer = (state, action) => {
      switch (action.type) {
        case 'UPDATE_SETTINGS':
          return { ...state, ...action.payload };
        case 'TOGGLE_THEME':
          return { ...state, theme: state.theme === 'light' ? 'dark' : 'light' };
        default:
          return state;
      }
    };
    
    // ==================== CONTEXTS ====================
    
    const FarmContext = createContext(null);
    const SettingsContext = createContext(null);
    
    const useFarm = () => {
      const ctx = useContext(FarmContext);
      if (!ctx) throw new Error('useFarm must be used within FarmProvider');
      return ctx;
    };
    
    const useSettings = () => {
      const ctx = useContext(SettingsContext);
      if (!ctx) throw new Error('useSettings must be used within SettingsProvider');
      return ctx;
    };
    
    // ==================== PROVIDERS ====================
    
    const FarmProvider = ({ children }) => {
      const [state, dispatch] = useReducer(farmReducer, initialFarmState, () => 
        storage.get(STORAGE_KEYS.FARM_DATA, initialFarmState)
      );
      useEffect(() => { storage.set(STORAGE_KEYS.FARM_DATA, state); }, [state]);
      return React.createElement(FarmContext.Provider, { value: { state, dispatch }, children });
    };
    
    const SettingsProvider = ({ children }) => {
      const [settings, dispatch] = useReducer(settingsReducer, initialSettings, () =>
        storage.get(STORAGE_KEYS.SETTINGS, initialSettings)
      );
      useEffect(() => { 
        storage.set(STORAGE_KEYS.SETTINGS, settings);
        if (settings.theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [settings]);
      return React.createElement(SettingsContext.Provider, { value: { settings, dispatch }, children });
    };
    
    // ==================== CALCULATION HOOK ====================
    
    const useFarmCalculations = () => {
      const { state } = useFarm();
      const { farmParams, mortalityEntries, eggEntries } = state;
      
      const totalDeaths = mortalityEntries.reduce((s, e) => s + e.deaths, 0);
      const finalBirds = Math.max(0, farmParams.birdCount - totalDeaths);
      const avgLiveBirds = (farmParams.birdCount + finalBirds) / 2;
      const dailyFeedKg = (farmParams.feedPerBirdGrams / 1000) * avgLiveBirds;
      const costPerKg = farmParams.bagCost / farmParams.bagWeightKg;
      const dailyFeedCost = dailyFeedKg * costPerKg;
      const totalFeedCost = dailyFeedKg * farmParams.cycleDays * costPerKg;
      const revenue = finalBirds * farmParams.sellingPrice;
      const profit = revenue - totalFeedCost;
      const costPerBird = finalBirds > 0 ? totalFeedCost / finalBirds : 0;
      
      const last7DaysEggs = eggEntries.filter(e => isWithinLastNDays(e.date, 7));
      const avgDailyEggs = last7DaysEggs.length ? last7DaysEggs.reduce((s, e) => s + e.count, 0) / last7DaysEggs.length : 0;
      const eggProductionRate = finalBirds > 0 ? (avgDailyEggs / finalBirds) * 100 : 0;
      
      const lastWeekDeaths = mortalityEntries.filter(e => isWithinLastNDays(e.date, 7)).reduce((s, e) => s + e.deaths, 0);
      const previousWeekDeaths = mortalityEntries.filter(e => {
        const date = new Date(e.date);
        const twoWeeksAgo = new Date();
        twoWeeksAgo.setDate(twoWeeksAgo.getDate() - 14);
        const oneWeekAgo = new Date();
        oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
        return date >= twoWeeksAgo && date < oneWeekAgo;
      }).reduce((s, e) => s + e.deaths, 0);
      const mortalityTrend = previousWeekDeaths > 0 ? ((lastWeekDeaths - previousWeekDeaths) / previousWeekDeaths) * 100 : 0;
      
      return {
        totalDeaths,
        finalBirds,
        dailyFeedKg,
        dailyFeedCost,
        totalFeedCost,
        revenue,
        profit,
        costPerBird,
        eggProductionRate,
        lastWeekDeaths,
        mortalityTrend,
      };
    };
    
    // ==================== INSIGHTS ====================
    
    const useInsights = () => {
      const { state } = useFarm();
      const calculations = useFarmCalculations();
      const { eggEntries, mortalityEntries, farmParams } = state;
      
      const insights = [];
      
      if (calculations.dailyFeedCost > 15) {
        insights.push({ type: 'warning', message: '📈 Daily feed cost is high. Consider negotiating bulk pricing.', icon: 'fa-chart-line' });
      }
      
      if (calculations.mortalityTrend > 20) {
        insights.push({ type: 'danger', message: '⚠️ Mortality increased by ' + calculations.mortalityTrend.toFixed(0) + '% this week.', icon: 'fa-skull' });
      } else if (calculations.mortalityTrend < -20) {
        insights.push({ type: 'success', message: '✅ Mortality decreased significantly. Great improvement!', icon: 'fa-heart' });
      }
      
      if (calculations.eggProductionRate < 60 && farmParams.farmType === 'layers') {
        insights.push({ type: 'warning', message: '🥚 Egg production below 60%. Review lighting and nutrition.', icon: 'fa-egg' });
      } else if (calculations.eggProductionRate > 80) {
        insights.push({ type: 'success', message: '🌟 Excellent egg production! Keep up the good work.', icon: 'fa-star' });
      }
      
      if (calculations.profit < 0) {
        insights.push({ type: 'danger', message: '💰 Projected profit is negative. Review your costs.', icon: 'fa-chart-simple' });
      }
      
      if (insights.length === 0) {
        insights.push({ type: 'info', message: '📊 All metrics look stable. Keep monitoring daily!', icon: 'fa-chart-simple' });
      }
      
      return insights.slice(0, 3);
    };
    
    // ==================== UI COMPONENTS ====================
    
    const ChartComponent = (props) => {
      const chartRef = React.useRef(null);
      const chartInstance = React.useRef(null);
      
      React.useEffect(() => {
        if (chartRef.current) {
          if (chartInstance.current) chartInstance.current.destroy();
          chartInstance.current = new Chart(chartRef.current, {
            type: props.type,
            data: props.data,
            options: { responsive: true, maintainAspectRatio: true, ...props.options }
          });
        }
        return () => { if (chartInstance.current) chartInstance.current.destroy(); };
      }, [props.data, props.type]);
      
      return React.createElement('canvas', { ref: chartRef });
    };
    
    const StatsCard = ({ title, value, icon, color }) => {
      const colorMap = {
        green: 'bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400',
        blue: 'bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400',
        amber: 'bg-amber-100 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400',
        red: 'bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400',
      };
      return React.createElement('div', { className: "bg-white dark:bg-gray-800 rounded-xl shadow-sm p-5 hover:shadow-md transition" },
        React.createElement('div', { className: "flex justify-between items-start" },
          React.createElement('div', null,
            React.createElement('p', { className: "text-sm text-gray-500 dark:text-gray-400" }, title),
            React.createElement('p', { className: "text-2xl font-bold text-gray-800 dark:text-white mt-1" }, value)
          ),
          React.createElement('div', { className: `w-10 h-10 rounded-lg ${colorMap[color]} flex items-center justify-center` },
            React.createElement('i', { className: `fas ${icon} text-lg` })
          )
        )
      );
    };
    
    const EmptyState = ({ title, message, icon }) =>
      React.createElement('div', { className: "text-center py-12 bg-white dark:bg-gray-800 rounded-xl shadow-sm" },
        React.createElement('i', { className: `fas ${icon} text-4xl text-gray-400 dark:text-gray-500 mb-3` }),
        React.createElement('h3', { className: "text-lg font-semibold text-gray-700 dark:text-gray-300 mb-2" }, title),
        React.createElement('p', { className: "text-gray-500 dark:text-gray-400 text-sm" }, message)
      );
    
    // ==================== DASHBOARD ====================
    
    const Dashboard = () => {
      const { state } = useFarm();
      const { settings } = useSettings();
      const calculations = useFarmCalculations();
      const insights = useInsights();
      const { eggEntries, mortalityEntries } = state;
      
      const currency = settings.currency;
      const weekDays = getWeekDays();
      const eggChartData = {
        labels: weekDays.map(d => new Date(d).toLocaleDateString('en-US', { weekday: 'short' })),
        datasets: [{
          label: 'Eggs Collected',
          data: weekDays.map(day => eggEntries.find(e => e.date === day)?.count || 0),
          borderColor: '#059669',
          backgroundColor: 'rgba(5, 150, 105, 0.1)',
          fill: true,
          tension: 0.4
        }]
      };
      
      return React.createElement('div', { className: "space-y-6" },
        React.createElement('h1', { className: "text-2xl font-bold text-gray-800 dark:text-white" }, "Dashboard"),
        
        React.createElement('div', { className: "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" },
          React.createElement(StatsCard, { title: "Live Birds", value: calculations.finalBirds.toLocaleString(), icon: "fa-dove", color: "green" }),
          React.createElement(StatsCard, { title: "Daily Feed Cost", value: `${currency}${calculations.dailyFeedCost.toFixed(2)}`, icon: "fa-sack-dollar", color: "amber" }),
          React.createElement(StatsCard, { title: "Est. Profit", value: `${currency}${calculations.profit.toFixed(2)}`, icon: "fa-chart-line", color: "blue" }),
          React.createElement(StatsCard, { title: "Egg Production", value: `${calculations.eggProductionRate.toFixed(1)}%`, icon: "fa-egg", color: "green" })
        ),
        
        React.createElement('div', { className: "grid grid-cols-1 lg:grid-cols-2 gap-6" },
          React.createElement('div', { className: "bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4" },
            React.createElement('h3', { className: "font-semibold text-gray-700 dark:text-gray-300 mb-3" }, "Egg Production Trend"),
            React.createElement(ChartComponent, { type: "line", data: eggChartData })
          ),
          React.createElement('div', { className: "bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4" },
            React.createElement('h3', { className: "font-semibold text-gray-700 dark:text-gray-300 mb-3" }, "Smart Insights"),
            React.createElement('div', { className: "space-y-3" },
              insights.map((insight, idx) =>
                React.createElement('div', { key: idx, className: "flex items-start gap-3 p-3 bg-gray-50 dark:bg-gray-700 rounded-lg" },
                  React.createElement('i', { className: `fas ${insight.icon} mt-0.5 ${insight.type === 'warning' ? 'text-yellow-600' : insight.type === 'danger' ? 'text-red-600' : insight.type === 'success' ? 'text-green-600' : 'text-blue-600'}` }),
                  React.createElement('span', { className: "text-sm text-gray-600 dark:text-gray-300" }, insight.message)
                )
              )
            )
          )
        ),
        
        React.createElement('div', { className: "grid grid-cols-1 md:grid-cols-2 gap-6" },
          React.createElement('div', { className: "bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4" },
            React.createElement('h3', { className: "font-semibold text-gray-700 dark:text-gray-300 mb-3" }, "Recent Egg Records"),
            eggEntries.slice(-5).reverse().length === 0 ?
              React.createElement(EmptyState, { title: "No Records", message: "Add your first egg production record", icon: "fa-egg" }) :
              eggEntries.slice(-5).reverse().map(entry =>
                React.createElement('div', { key: entry.id, className: "flex justify-between items-center p-2 border-b dark:border-gray-700" },
                  React.createElement('span', { className: "text-sm text-gray-600 dark:text-gray-400" }, entry.date),
                  React.createElement('span', { className: "font-semibold text-green-600" }, `${entry.count} eggs`)
                )
              )
          ),
          React.createElement('div', { className: "bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4" },
            React.createElement('h3', { className: "font-semibold text-gray-700 dark:text-gray-300 mb-3" }, "Recent Mortality"),
            mortalityEntries.slice(-5).reverse().length === 0 ?
              React.createElement(EmptyState, { title: "No Records", message: "Log mortality to track trends", icon: "fa-skull" }) :
              mortalityEntries.slice(-5).reverse().map(entry =>
                React.createElement('div', { key: entry.id, className: "flex justify-between items-center p-2 border-b dark:border-gray-700" },
                  React.createElement('span', { className: "text-sm text-gray-600 dark:text-gray-400" }, entry.date),
                  React.createElement('span', { className: "font-semibold text-red-600" }, `${entry.deaths} deaths`)
                )
              )
          )
        )
      );
    };
    
    // ==================== FEED CALCULATOR ====================
    
    const FeedCalculator = () => {
      const { state, dispatch } = useFarm();
      const { settings } = useSettings();
      const [params, setParams] = useState(state.farmParams);
      const [mortalityInput, setMortalityInput] = useState(0);
      
      useEffect(() => setParams(state.farmParams), [state.farmParams]);
      
      const handleChange = (key, val) => setParams(p => ({ ...p, [key]: val }));
      const save = () => dispatch({ type: 'UPDATE_FARM_PARAMS', payload: params });
      const applyPreset = (presetKey) => {
        const preset = FARM_PRESETS[presetKey];
        if (preset) {
          setParams({ ...params, ...preset });
          dispatch({ type: 'APPLY_PRESET', payload: preset });
        }
      };
      
      const finalBirds = Math.max(0, params.birdCount - mortalityInput);
      const avgLive = (params.birdCount + finalBirds) / 2;
      const dailyKg = (params.feedPerBirdGrams / 1000) * avgLive;
      const costPerKg = params.bagCost / params.bagWeightKg;
      const dailyCost = dailyKg * costPerKg;
      const totalFeedCost = dailyKg * params.cycleDays * costPerKg;
      const profit = (finalBirds * params.sellingPrice) - totalFeedCost;
      const currency = settings.currency;
      
      return React.createElement('div', { className: "space-y-6" },
        React.createElement('h1', { className: "text-2xl font-bold text-gray-800 dark:text-white" }, "Feed & Profit Calculator"),
        
        React.createElement('div', { className: "bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4" },
          React.createElement('h3', { className: "font-semibold text-gray-700 dark:text-gray-300 mb-3" }, "Quick Farm Presets"),
          React.createElement('div', { className: "flex flex-wrap gap-2" },
            Object.entries(FARM_PRESETS).map(([key, preset]) =>
              React.createElement('button', { key, onClick: () => applyPreset(key), className: "px-3 py-1.5 bg-green-100 dark:bg-green-900 text-green-700 dark:text-green-300 rounded-lg text-sm hover:bg-green-200 transition" }, preset.name)
            )
          )
        ),
        
        React.createElement('div', { className: "bg-white dark:bg-gray-800 rounded-xl shadow-sm p-5" },
          React.createElement('div', { className: "grid grid-cols-1 md:grid-cols-2 gap-4" },
            React.createElement('div', null,
              React.createElement('label', { className: "block text-sm font-medium text-gray-600 dark:text-gray-400" }, "Number of Birds"),
              React.createElement('input', { type: "number", value: params.birdCount, onChange: e => handleChange('birdCount', +e.target.value), className: "mt-1 w-full border rounded-lg p-2 dark:bg-gray-700 dark:border-gray-600" })
            ),
            React.createElement('div', null,
              React.createElement('label', { className: "block text-sm font-medium text-gray-600 dark:text-gray-400" }, "Feed/Bird/Day (g)"),
              React.createElement('input', { type: "number", value: params.feedPerBirdGrams, onChange: e => handleChange('feedPerBirdGrams', +e.target.value), className: "mt-1 w-full border rounded-lg p-2 dark:bg-gray-700 dark:border-gray-600" })
            ),
            React.createElement('div', null,
              React.createElement('label', { className: "block text-sm font-medium text-gray-600 dark:text-gray-400" }, "Bag Cost"),
              React.createElement('input', { type: "number", value: params.bagCost, onChange: e => handleChange('bagCost', +e.target.value), className: "mt-1 w-full border rounded-lg p-2 dark:bg-gray-700 dark:border-gray-600" })
            ),
            React.createElement('div', null,
              React.createElement('label', { className: "block text-sm font-medium text-gray-600 dark:text-gray-400" }, "Bag Weight (kg)"),
              React.createElement('input', { type: "number", value: params.bagWeightKg, onChange: e => handleChange('bagWeightKg', +e.target.value), className: "mt-1 w-full border rounded-lg p-2 dark:bg-gray-700 dark:border-gray-600" })
            ),
            React.createElement('div', null,
              React.createElement('label', { className: "block text-sm font-medium text-gray-600 dark:text-gray-400" }, "Selling Price"),
              React.createElement('input', { type: "number", value: params.sellingPrice, onChange: e => handleChange('sellingPrice', +e.target.value), className: "mt-1 w-full border rounded-lg p-2 dark:bg-gray-700 dark:border-gray-600" })
            ),
            React.createElement('div', null,
              React.createElement('label', { className: "block text-sm font-medium text-gray-600 dark:text-gray-400" }, "Cycle Days"),
              React.createElement('input', { type: "number", value: params.cycleDays, onChange: e => handleChange('cycleDays', +e.target.value), className: "mt-1 w-full border rounded-lg p-2 dark:bg-gray-700 dark:border-gray-600" })
            ),
            React.createElement('div', null,
              React.createElement('label', { className: "block text-sm font-medium text-gray-600 dark:text-gray-400" }, "Expected Mortality"),
              React.createElement('input', { type: "number", value: mortalityInput, onChange: e => setMortalityInput(+e.target.value), className: "mt-1 w-full border rounded-lg p-2 dark:bg-gray-700 dark:border-gray-600" })
            )
          ),
          React.createElement('button', { onClick: save, className: "mt-4 w-full bg-green-600 text-white px-5 py-2 rounded-lg hover:bg-green-700 transition" }, "Save Parameters")
        ),
        
        React.createElement('div', { className: "bg-gradient-to-r from-green-50 to-emerald-50 dark:from-gray-800 dark:to-gray-800 rounded-xl p-5" },
          React.createElement('h3', { className: "font-semibold text-gray-800 dark:text-white mb-3" }, "📊 Results"),

            React.createElement('p', { className: "text-sm text-gray-600 dark:text-gray-400" }, "Total Mortality"),

            React.createElement('p', { className: "text-sm text-gray-600 dark:text-gray-400" }, "Last 7 days"),

        React.createElement('div', { className: "space-y-2 max-h-80 overflow-auto" },

    // ==================== SETTINGS ====================
    
    const Settings = () => {
      const { settings, dispatch: settingsDispatch } = useSettings();

        settingsDispatch({ type: 'UPDATE_SETTINGS', payload: { [key]: value } });

      const exportData = () => {
        const { state } = useFarm();
        const dataStr = JSON.stringify(state, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `farmos_backup_${new Date().toISOString().slice(0, 19)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };
      
      const importData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const imported = JSON.parse(ev.target.result);
            if (imported.farmParams) {
              farmDispatch({ type: 'IMPORT_DATA', payload: imported });
              alert('Data imported successfully!');
            } else {
              alert('Invalid file structure');
            }
          } catch { alert('Error parsing JSON'); }
        };
        reader.readAsText(file);
        e.target.value = '';
      };
      
      const resetAll = () => {
        if (confirm('⚠️ Are you sure? This will delete ALL your farm data.')) {
          farmDispatch({ type: 'RESET_ALL' });
          alert('All data has been reset.');
        }

        const preset = FARM_PRESETS[presetKey];

          React.createElement('div', { className: "max-w-6xl mx-auto p-4 lg:p-6" }, children)
        )
      );
    };
    
    // ==================== MAIN APP ====================
    
    const App = () => {
      const [activeTab, setActiveTab] = useState('dashboard');
      
      const components = {

        hatch: HatchTracker,
        mortality: MortalityTracker,
        settings: Settings,

      const CurrentComponent = components[activeTab];
      
      return React.createElement(FarmProvider, null,
        React.createElement(SettingsProvider, null,
