<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#166534">
  <title>FarmOS Lite – Professional Farm Management</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Custom styles for dark mode transitions */
    * {
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.2s ease;
    }
    .sidebar-transition {
      transition: transform 0.3s ease-in-out;
    }
    @media (max-width: 768px) {
      .sidebar-hidden {
        transform: translateX(-100%);
      }
      .sidebar-visible {
        transform: translateX(0);
      }
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #166534; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #14532d; }
    .dark ::-webkit-scrollbar-track { background: #1f2937; }
    .dark ::-webkit-scrollbar-thumb { background: #059669; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors">
  <div id="root"></div>

  <script>
    // --------------------------------------------
    // COMPLETE FARMOS LITE - MODULAR SINGLE FILE
    // --------------------------------------------
    
    const { useState, useEffect, createContext, useContext, useReducer, useCallback, useMemo, lazy, Suspense } = React;
    const ReactDOM = ReactDOM;
    
    // ==================== UTILITIES ====================
    
    // Date helpers
    const formatDate = (date) => {
      const d = new Date(date);
      return d.toISOString().split('T')[0];
    };
    const today = () => formatDate(new Date());
    const getWeekDays = () => {
      const now = new Date();
      const dayOfWeek = now.getDay();
      const monday = new Date(now);
      monday.setDate(now.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        days.push(formatDate(d));
      }
      return days;
    };
    const isWithinLastNDays = (dateStr, days) => {
      const date = new Date(dateStr);
      const nDaysAgo = new Date();
      nDaysAgo.setDate(nDaysAgo.getDate() - days);
      return date >= nDaysAgo;
    };
    
    // Storage utility
    const STORAGE_KEYS = {
      FARM_DATA: 'farmos_farm_data',
      SETTINGS: 'farmos_settings',
    };
    
    const storage = {
      get: (key, defaultValue) => {
        try {
          const item = localStorage.getItem(key);
          return item ? JSON.parse(item) : defaultValue;
        } catch { return defaultValue; }
      },
      set: (key, value) => {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch { return false; }
      },
    };
    
    // Farm presets
    const FARM_PRESETS = {
      broilers: {
        name: 'Broilers',
        birdCount: 500,
        feedPerBirdGrams: 150,
        bagCost: 25,
        bagWeightKg: 25,
        sellingPrice: 8,
        cycleDays: 42,
        eggProduction: false,
      },
      layers: {
        name: 'Layers',
        birdCount: 200,
        feedPerBirdGrams: 120,
        bagCost: 25,
        bagWeightKg: 25,
        sellingPrice: 6,
        cycleDays: 365,
        eggProduction: true,
      },
      quails: {
        name: 'Quails',
        birdCount: 1000,
        feedPerBirdGrams: 30,
        bagCost: 20,
        bagWeightKg: 25,
        sellingPrice: 2,
        cycleDays: 45,
        eggProduction: true,
      },
      turkeys: {
        name: 'Turkeys',
        birdCount: 100,
        feedPerBirdGrams: 300,
        bagCost: 35,
        bagWeightKg: 25,
        sellingPrice: 25,
        cycleDays: 120,
        eggProduction: false,
      },
    };
    
    // ==================== TYPES & INITIAL STATES ====================
    
    const initialFarmState = {
      farmParams: {
        birdCount: 100,
        feedPerBirdGrams: 120,
        bagCost: 25,
        bagWeightKg: 25,
        sellingPrice: 5,
        cycleDays: 60,
        farmType: 'layers',
      },
      eggEntries: [],
      hatchEntries: [],
      mortalityEntries: [],
    };
    
    const initialSettings = {
      currency: '$',
      theme: 'light',
      farmType: 'layers',
    };
    
    // ==================== REDUCERS ====================
    
    const farmReducer = (state, action) => {
      switch (action.type) {
        case 'UPDATE_FARM_PARAMS':
          return { ...state, farmParams: { ...state.farmParams, ...action.payload } };
        case 'APPLY_PRESET':
          return { ...state, farmParams: { ...state.farmParams, ...action.payload, farmType: action.payload.farmType } };
        case 'ADD_EGG_ENTRY':
          return { ...state, eggEntries: [...state.eggEntries, action.payload] };
        case 'DELETE_EGG_ENTRY':
          return { ...state, eggEntries: state.eggEntries.filter(e => e.id !== action.payload) };
        case 'ADD_HATCH_ENTRY':
          return { ...state, hatchEntries: [...state.hatchEntries, action.payload] };
        case 'DELETE_HATCH_ENTRY':
          return { ...state, hatchEntries: state.hatchEntries.filter(h => h.id !== action.payload) };
        case 'ADD_MORTALITY_ENTRY':
          return { ...state, mortalityEntries: [...state.mortalityEntries, action.payload] };
        case 'DELETE_MORTALITY_ENTRY':
          return { ...state, mortalityEntries: state.mortalityEntries.filter(m => m.id !== action.payload) };
        case 'IMPORT_DATA':
          return action.payload;
        case 'RESET_ALL':
          return initialFarmState;
        default:
          return state;
      }
    };
    
    const settingsReducer = (state, action) => {
      switch (action.type) {
        case 'UPDATE_SETTINGS':
          return { ...state, ...action.payload };
        case 'TOGGLE_THEME':
          const newTheme = state.theme === 'light' ? 'dark' : 'light';
          return { ...state, theme: newTheme };
        default:
          return state;
      }
    };
    
    // ==================== CONTEXTS ====================
    
    const FarmContext = createContext(null);
    const SettingsContext = createContext(null);
    
    const useFarm = () => {
      const ctx = useContext(FarmContext);
      if (!ctx) throw new Error('useFarm must be used within FarmProvider');
      return ctx;
    };
    
    const useSettings = () => {
      const ctx = useContext(SettingsContext);
      if (!ctx) throw new Error('useSettings must be used within SettingsProvider');
      return ctx;
    };
    
    // ==================== PROVIDERS ====================
    
    const FarmProvider = ({ children }) => {
      const [state, dispatch] = useReducer(farmReducer, initialFarmState, () => 
        storage.get(STORAGE_KEYS.FARM_DATA, initialFarmState)
      );
      useEffect(() => { storage.set(STORAGE_KEYS.FARM_DATA, state); }, [state]);
      return React.createElement(FarmContext.Provider, { value: { state, dispatch }, children });
    };
    
    const SettingsProvider = ({ children }) => {
      const [settings, dispatch] = useReducer(settingsReducer, initialSettings, () =>
        storage.get(STORAGE_KEYS.SETTINGS, initialSettings)
      );
      useEffect(() => { 
        storage.set(STORAGE_KEYS.SETTINGS, settings);
        // Apply theme to document
        if (settings.theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [settings]);
      return React.createElement(SettingsContext.Provider, { value: { settings, dispatch }, children });
    };
    
    // ==================== CALCULATION HOOKS ====================
    
    const useFarmCalculations = () => {
      const { state } = useFarm();
      const { farmParams, mortalityEntries, eggEntries } = state;
      
      const totalDeaths = useMemo(() => mortalityEntries.reduce((s, e) => s + e.deaths, 0), [mortalityEntries]);
      const finalBirds = Math.max(0, farmParams.birdCount - totalDeaths);
      const avgLiveBirds = (farmParams.birdCount + finalBirds) / 2;
      const dailyFeedKg = (farmParams.feedPerBirdGrams / 1000) * avgLiveBirds;
      const costPerKg = farmParams.bagCost / farmParams.bagWeightKg;
      const dailyFeedCost = dailyFeedKg * costPerKg;
      const totalFeedCost = dailyFeedKg * farmParams.cycleDays * costPerKg;
      const revenue = finalBirds * farmParams.sellingPrice;
      const profit = revenue - totalFeedCost;
      const costPerBird = finalBirds > 0 ? totalFeedCost / finalBirds : 0;
      
      // Egg production
      const last7DaysEggs = eggEntries.filter(e => isWithinLastNDays(e.date, 7));
      const avgDailyEggs = last7DaysEggs.length ? last7DaysEggs.reduce((s, e) => s + e.count, 0) / last7DaysEggs.length : 0;
      const eggProductionRate = finalBirds > 0 ? (avgDailyEggs / finalBirds) * 100 : 0;
      
      // Weekly mortality trend
      const lastWeekDeaths = mortalityEntries.filter(e => isWithinLastNDays(e.date, 7)).reduce((s, e) => s + e.deaths, 0);
      const previousWeekDeaths = mortalityEntries.filter(e => {
        const date = new Date(e.date);
        const twoWeeksAgo = new Date();
        twoWeeksAgo.setDate(twoWeeksAgo.getDate() - 14);
        const oneWeekAgo = new Date();
        oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
        return date >= twoWeeksAgo && date < oneWeekAgo;
      }).reduce((s, e) => s + e.deaths, 0);
      const mortalityTrend = previousWeekDeaths > 0 ? ((lastWeekDeaths - previousWeekDeaths) / previousWeekDeaths) * 100 : 0;
      
      return {
        totalDeaths,
        finalBirds,
        avgLiveBirds,
        dailyFeedKg,
        dailyFeedCost,
        totalFeedCost,
        revenue,
        profit,
        costPerBird,
        eggProductionRate,
        lastWeekDeaths,
        mortalityTrend,
        avgDailyEggs,
      };
    };
    
    // ==================== INSIGHTS GENERATOR ====================
    
    const useInsights = () => {
      const { state } = useFarm();
      const calculations = useFarmCalculations();
      const { eggEntries, mortalityEntries, farmParams } = state;
      
      const insights = useMemo(() => {
        const newInsights = [];
        
        // Feed cost insight
        if (calculations.dailyFeedCost > 15) {
          newInsights.push({ type: 'warning', message: '📈 Daily feed cost is high (>$15). Consider negotiating bulk pricing.', icon: 'fa-chart-line' });
        }
        
        // Mortality insight
        if (calculations.mortalityTrend > 20) {
          newInsights.push({ type: 'danger', message: '⚠️ Mortality increased by ' + calculations.mortalityTrend.toFixed(0) + '% this week. Check health conditions.', icon: 'fa-skull' });
        } else if (calculations.mortalityTrend < -20) {
          newInsights.push({ type: 'success', message: '✅ Mortality decreased significantly. Great improvement!', icon: 'fa-heart' });
        }
        
        // Egg production insight
        if (calculations.eggProductionRate < 60 && farmParams.farmType === 'layers') {
          newInsights.push({ type: 'warning', message: '🥚 Egg production below 60%. Review lighting and nutrition.', icon: 'fa-egg' });
        } else if (calculations.eggProductionRate > 80) {
          newInsights.push({ type: 'success', message: '🌟 Excellent egg production! Keep up the good management.', icon: 'fa-star' });
        }
        
        // Recent activity
        const lastEggEntry = eggEntries[eggEntries.length - 1];
        if (lastEggEntry && !isWithinLastNDays(lastEggEntry.date, 2)) {
          newInsights.push({ type: 'info', message: '📝 No egg production logged in last 2 days. Update your records.', icon: 'fa-clock' });
        }
        
        // Profit insight
        if (calculations.profit < 0) {
          newInsights.push({ type: 'danger', message: '💰 Projected profit is negative. Review feed costs or selling price.', icon: 'fa-chart-simple' });
        } else if (calculations.profit > 1000) {
          newInsights.push({ type: 'success', message: '🎉 Strong profit projection! Consider expanding operations.', icon: 'fa-trophy' });
        }
        
        if (newInsights.length === 0) {
          newInsights.push({ type: 'info', message: '📊 All metrics look stable. Keep monitoring daily for best results.', icon: 'fa-chart-simple' });
        }
        
        return newInsights.slice(0, 3);
      }, [calculations, eggEntries, mortalityEntries, farmParams]);
      
      return insights;
    };
    
    // ==================== UI COMPONENTS ====================
    
    // Loading Spinner
    const LoadingSpinner = () => 
      React.createElement('div', { className: "flex justify-center items-center py-12" },
        React.createElement('div', { className: "animate-spin rounded-full h-12 w-12 border-b-2 border-green-600" })
      );
    
    // Empty State
    const EmptyState = ({ title, message, icon }) =>
      React.createElement('div', { className: "text-center py-12 bg-white dark:bg-gray-800 rounded-xl shadow-sm" },
        React.createElement('i', { className: `fas ${icon} text-5xl text-gray-400 mb-4` }),
        React.createElement('h3', { className: "text-lg font-semibold text-gray-700 dark:text-gray-300 mb-2" }, title),
        React.createElement('p', { className: "text-gray-500 dark:text-gray-400" }, message)
      );
    
    // Stats Card
    const StatsCard = ({ title, value, icon, color, trend }) =>
      React.createElement('div', { className: "bg-white dark:bg-gray-800 rounded-xl shadow-sm p-6 hover:shadow-md transition-shadow" },
        React.createElement('div', { className: "flex justify-between items-start" },
          React.createElement('div', null,
            React.createElement('p', { className: "text-sm text-gray-500 dark:text-gray-400 mb-1" }, title),
            React.createElement('p', { className: "text-2xl font-bold text-gray-800 dark:text-white" }, value),
            trend && React.createElement('p', { className: `text-xs mt-2 ${trend > 0 ? 'text-green-600' : 'text-red-600'}` }, 
              trend > 0 ? `↑ ${trend}%` : `↓ ${Math.abs(trend)}%`
            )
          ),
          React.createElement('div', { className: `w-12 h-12 rounded-lg bg-${color}-100 dark:bg-${color}-900/30 flex items-center justify-center` },
            React.createElement('i', { className: `fas ${icon} text-${color}-600 dark:text-${color}-400 text-xl` })
          )
        )
      );
    
    // Chart Component wrapper
    class ChartComponent extends React.Component {
      chartRef = React.createRef();
      chart = null;
      
      componentDidMount() {
        this.createChart();
      }
      
      componentDidUpdate(prevProps) {
        if (JSON.stringify(prevProps.data) !== JSON.stringify(this.props.data)) {
          this.updateChart();
        }
      }
      
      componentWillUnmount() {
        if (this.chart) this.chart.destroy();
      }
      
      createChart() {
        const ctx = this.chartRef.current.getContext('2d');
        this.chart = new Chart(ctx, {
          type: this.props.type,
          data: this.props.data,
          options: { responsive: true, maintainAspectRatio: true, ...this.props.options }
        });
      }
      
      updateChart() {
        if (this.chart) {
          this.chart.data = this.props.data;
          this.chart.update();
        }
      }
      
      render() {
        return React.createElement('canvas', { ref: this.chartRef });
      }
    }
    
    // ==================== MAIN COMPONENTS ====================
    
    // Dashboard Component
    const Dashboard = () => {
      const { state } = useFarm();
      const { settings } = useSettings();
      const calculations = useFarmCalculations();
      const insights = useInsights();
      const { eggEntries, mortalityEntries } = state;
      
      const currency = settings.currency;
      const recentEggs = eggEntries.slice(-5).reverse();
      const recentMortality = mortalityEntries.slice(-5).reverse();
      
      // Chart data
      const eggChartData = {
        labels: getWeekDays().map(d => new Date(d).toLocaleDateString('en-US', { weekday: 'short' })),
        datasets: [{
          label: 'Eggs Collected',
          data: getWeekDays().map(day => eggEntries.find(e => e.date === day)?.count || 0),
          borderColor: '#059669',
          backgroundColor: 'rgba(5, 150, 105, 0.1)',
          fill: true,
          tension: 0.4
        }]
      };
      
      const mortalityChartData = {
        labels: ['Week 4', 'Week 3', 'Week 2', 'Last Week', 'This Week'],
        datasets: [{
          label: 'Deaths',
          data: [12, 8, 6, calculations.lastWeekDeaths, calculations.lastWeekDeaths],
          borderColor: '#dc2626',
          backgroundColor: 'rgba(220, 38, 38, 0.1)',
          fill: true,
          tension: 0.4
        }]
      };
      
      return React.createElement('div', { className: "space-y-6" },
        React.createElement('h1', { className: "text-2xl font-bold text-gray-800 dark:text-white" }, "Dashboard"),
        
        // Stats Grid
        React.createElement('div', { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4" },
          React.createElement(StatsCard, { title: "Total Birds", value: calculations.finalBirds, icon: "fa-dove", color: "green", trend: null }),
          React.createElement(StatsCard, { title: "Daily Feed Cost", value: `${currency}${calculations.dailyFeedCost.toFixed(2)}`, icon: "fa-sack-dollar", color: "amber", trend: null }),
          React.createElement(StatsCard, { title: "Est. Profit", value: `${currency}${calculations.profit.toFixed(2)}`, icon: "fa-chart-line", color: "blue", trend: calculations.profit > 0 ? 15 : -8 }),
          React.createElement(StatsCard, { title: "Egg Production", value: `${calculations.eggProductionRate.toFixed(1)}%`, icon: "fa-egg", color: "yellow", trend: calculations.eggProductionRate > 70 ? 5 : -3 })
        ),
        
        // Charts Row
        React.createElement('div', { className: "grid grid-cols-1 lg:grid-cols-2 gap-6" },
          React.createElement('div', { className: "bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4" },
            React.createElement('h3', { className: "font-semibold text-gray-700 dark:text-gray-300 mb-3" }, "Egg Production Trend"),
            React.createElement(ChartComponent, { type: "line", data: eggChartData, options: { responsive: true, maintainAspectRatio: true } })
          ),
          React.createElement('div', { className: "bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4" },
            React.createElement('h3', { className: "font-semibold text-gray-700 dark:text-gray-300 mb-3" }, "Mortality Trend"),
            React.createElement(ChartComponent, { type: "line", data: mortalityChartData, options: { responsive: true, maintainAspectRatio: true } })
          )
        ),
        
        // Smart Insights
        React.createElement('div', { className: "bg-gradient-to-r from-green-50 to-emerald-50 dark:from-gray-800 dark:to-gray-800 rounded-xl p-5" },
          React.createElement('h3', { className: "font-semibold text-gray-700 dark:text-gray-300 mb-3 flex items-center gap-2" },
            React.createElement('i', { className: "fas fa-lightbulb text-yellow-600" }), "Smart Insights"
          ),
          React.createElement('div', { className: "space-y-2" },
            insights.map((insight, idx) => 
              React.createElement('div', { key: idx, className: "flex items-start gap-3 text-sm" },
                React.createElement('i', { className: `fas ${insight.icon} mt-0.5 ${insight.type === 'warning' ? 'text-yellow-600' : insight.type === 'danger' ? 'text-red-600' : insight.type === 'success' ? 'text-green-600' : 'text-blue-600'}` }),
                React.createElement('span', { className: "text-gray-600 dark:text-gray-400" }, insight.message)
              )
            )
          )
        ),
        
        // Recent Activity
        React.createElement('div', { className: "grid grid-cols-1 md:grid-cols-2 gap-6" },
          React.createElement('div', { className: "bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4" },
            React.createElement('h3', { className: "font-semibold text-gray-700 dark:text-gray-300 mb-3" }, "Recent Egg Records"),
            recentEggs.length === 0 ? 
              React.createElement(EmptyState, { title: "No Records", message: "Add your first egg production record", icon: "fa-egg" }) :
              React.createElement('div', { className: "space-y-2" }, recentEggs.map(entry =>
                React.createElement('div', { key: entry.id, className: "flex justify-between items-center p-2 bg-gray-50 dark:bg-gray-700 rounded" },
                  React.createElement('span', { className: "text-sm text-gray-600 dark:text-gray-300" }, entry.date),
                  React.createElement('span', { className: "font-semibold text-green-600" }, `${entry.count} eggs`)
                )
              ))
          ),
          React.createElement('div', { className: "bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4" },
            React.createElement('h3', { className: "font-semibold text-gray-700 dark:text-gray-300 mb-3" }, "Recent Mortality"),
            recentMortality.length === 0 ?
              React.createElement(EmptyState, { title: "No Records", message: "Log mortality to track trends", icon: "fa-skull" }) :
              React.createElement('div', { className: "space-y-2" }, recentMortality.map(entry =>
                React.createElement('div', { key: entry.id, className: "flex justify-between items-center p-2 bg-gray-50 dark:bg-gray-700 rounded" },
                  React.createElement('span', { className: "text-sm text-gray-600 dark:text-gray-300" }, entry.date),
                  React.createElement('span', { className: "font-semibold text-red-600" }, `${entry.deaths} deaths`)
                )
              ))
          )
        )
      );
    };
    
    // Feed Calculator Component
    const FeedCalculator = () => {
      const { state, dispatch } = useFarm();
      const { settings } = useSettings();
      const [params, setParams] = useState(state.farmParams);
      const [mortalityInput, setMortalityInput] = useState(0);
      
      useEffect(() => setParams(state.farmParams), [state.farmParams]);
      
      const handleChange = (key, val) => setParams(p => ({ ...p, [key]: val }));
      const save = () => dispatch({ type: 'UPDATE_FARM_PARAMS', payload: params });
      const applyPreset = (presetKey) => {
        const preset = FARM_PRESETS[presetKey];
        if (preset) {
          setParams({ ...params, ...preset, farmType: presetKey });
          dispatch({ type: 'APPLY_PRESET', payload: { ...preset, farmType: presetKey } });
        }
      };
      
      const finalBirds = Math.max(0, params.birdCount - mortalityInput);
      const avgLive = (params.birdCount + finalBirds) / 2;
      const dailyKg = (params.feedPerBirdGrams / 1000) * avgLive;
      const costPerKg = params.bagCost / params.bagWeightKg;
      const dailyCost = dailyKg * costPerKg;
      const totalFeedCost = dailyKg * params.cycleDays * costPerKg;
      const costPerBird = finalBirds > 0 ? totalFeedCost / finalBirds : 0;
      const profit = (finalBirds * params.sellingPrice) - totalFeedCost;
      const currency = settings.currency;
      
      const inputs = [
        { key: 'birdCount', label: 'Number of Birds', min: 0 },
        { key: 'feedPerBirdGrams', label: 'Feed/Bird/Day (g)', min: 0 },
        { key: 'bagCost', label: 'Bag Cost', min: 0 },
        { key: 'bagWeightKg', label: 'Bag Weight (kg)', min: 0 },
        { key: 'sellingPrice', label: 'Selling Price', min: 0 },
        { key: 'cycleDays', label: 'Cycle Length (days)', min: 1 }
      ];
      
      return React.createElement('div', { className: "space-y-6" },
        React.createElement('h1', { className: "text-2xl font-bold text-gray-800 dark:text-white" }, "Feed & Profit Calculator"),
        
        // Farm Presets
        React.createElement('div', { className: "bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4" },
          React.createElement('h3', { className: "font-semibold text-gray-700 dark:text-gray-300 mb-3" }, "Quick Farm Presets"),
          React.createElement('div', { className: "flex flex-wrap gap-2" },
            Object.entries(FARM_PRESETS).map(([key, preset]) =>
              React.createElement('button', { key, onClick: () => applyPreset(key), className: "px-4 py-2 bg-green-100 dark:bg-green-900 text-green-700 dark:text-green-300 rounded-lg text-sm hover:bg-green-200 transition" }, preset.name)
            )
          )
        ),
